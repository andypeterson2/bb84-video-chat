# coturn configuration for qvc — ephemeral TURN credentials (REST API).
#
# The shared secret, realm, and external IP are injected at RUNTIME by
# entrypoint.sh from the environment — they are NEVER baked into this file or
# the image. The signaling server mints per-session credentials with the same
# secret (see signaling/turn.py); coturn recomputes the HMAC to validate them.

# TURN REST API: validate time-limited HMAC credentials, no static users.
use-auth-secret

listening-port=3478
tls-listening-port=5349
fingerprint
no-cli
no-tcp-relay

# Relay port range — open these on the host / Railway networking.
min-port=49160
max-port=49200

# Never relay to internal/link-local ranges (SSRF hardening).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
no-multicast-peers
