name: CI

on:
  push:
    branches: [main, refactor]
  # No base filter: stacked security/feature PRs (base = another branch) must
  # gate the same way as PRs into main.
  pull_request:

env:
  QVC_DEVELOPMENT: 'true'

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        # The pin lives in requirements-dev.txt — the enforced rule set must
        # not float with ruff releases.
        run: pip install "ruff~=0.15.16"

      - name: Run ruff check
        # Whole repo — the old signaling/-scoped invocation silently skipped
        # tests/conftest.py and tests/__init__.py.
        run: ruff check .

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r signaling/requirements.txt
          pip install -r bench/requirements.txt
          pip install pytest pytest-timeout

      - name: Run signaling + bench tests
        run: |
          python -m pytest tests/signaling/ tests/bench/ \
            -v --tb=short --timeout=60

  js-tests:
    name: JS Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm install

      - name: Lint the client + tests
        run: npm run lint

      - name: Run JS tests
        run: npx vitest run

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build signaling server image
        run: docker build -f Dockerfile.server -t qvc-signaling .

      - name: Verify server starts
        run: |
          docker run -d --name qvc-signaling-test \
            -e QVC_SERVER_REST_PORT=5050 \
            -e QVC_HOST=0.0.0.0 \
            -e SIO_ASYNC_MODE=eventlet \
            -p 5050:5050 qvc-signaling
          sleep 5
          # /health is unauthenticated; /admin/* is fail-closed behind QVC_ADMIN_SECRET
          # (404 without it), so probing it would fail on a healthy server.
          curl -sf http://localhost:5050/health || (docker logs qvc-signaling-test && exit 1)
          # And confirm the fail-closed guard: /admin/status must 404 with no secret set.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5050/admin/status)
          [ "$status" = "404" ] || (echo "admin surface not fail-closed (got $status)" && exit 1)
          docker stop qvc-signaling-test
