name: Render PlantUML Diagrams

on:
  push:
    paths:
      - 'docs/diagrams/**/*.puml'
  workflow_dispatch:

# The renders go out as a downloadable artifact, so this job only reads.
permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Download PlantUML
        # Pinned and checksummed: an unreviewed `releases/latest` would run
        # whatever upstream published. Bump both values together.
        env:
          PLANTUML_VERSION: '1.2026.8'
          PLANTUML_SHA256: '5e1ecfa8ecd32c90b03bbf3b1eb6f020943f98ab0fcf4032be31a0002ee2c462'
        run: |
          mkdir -p /tmp/plantuml
          curl -fsSL -o /tmp/plantuml/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml.jar"
          echo "${PLANTUML_SHA256}  /tmp/plantuml/plantuml.jar" | sha256sum --check --strict

      - name: Render diagrams to SVG
        run: |
          mkdir -p /tmp/rendered
          java -jar /tmp/plantuml/plantuml.jar -tsvg -o /tmp/rendered docs/diagrams/*.puml

      - name: Upload rendered diagrams
        uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: /tmp/rendered
          retention-days: 30
