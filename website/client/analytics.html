<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Same CSP posture as the call page. This page opens no network
         connections (the analytics bus is a same-origin BroadcastChannel, which
         CSP does not gate), so connect-src is tightened to 'self'. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; object-src 'none'"
    />
    <title>QKD Analytics</title>
    <link rel="stylesheet" href="static/analytics.css?v=12" />
  </head>
  <body>
    <div id="analytics-root"></div>
    <script type="module" src="static/js/analytics/analytics.js?v=12"></script>
  </body>
</html>
