<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Same CSP posture as the call page. This page opens no network
         connections (the analytics bus is a same-origin BroadcastChannel, which
         CSP does not gate), so connect-src is tightened to 'self'. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; object-src 'none'"
    />
    <title>QKD Analytics</title>
    <style>
      /* Institutional tokens (kept in sync with static/style.css). Light is the
         default; [data-theme='dark'] flips to a navy ground. */
      :root {
        --body-font: 'Source Sans 3', system-ui, -apple-system, sans-serif;
        --bg-base: #ffffff;
        --bg-surface: #f7f4ec;
        --text-primary: #182b49;
        --text-muted: #5c6675;
        --accent: #00629b;
        --error: #c0362c;
        --success: #5e8233;
        --warning: #b96b06;
        --border-subtle: #e5e0d4;
        --card-bg: #f7f4ec;
        --radius: 7px;
      }
      :root[data-theme='dark'] {
        --bg-base: #0d1826;
        --bg-surface: #14263c;
        --text-primary: #e6ebf2;
        --text-muted: #93a1b5;
        --accent: #4aa3d6;
        --error: #e5776b;
        --success: #9ac45f;
        --warning: #f2a24a;
        --border-subtle: #263a52;
        --card-bg: #14263c;
      }
      * {
        box-sizing: border-box;
      }
      /* Author display rules (e.g. .controls{display:flex}) outrank the UA
         [hidden] style, so make the attribute win explicitly. */
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--body-font);
        -webkit-font-smoothing: antialiased;
        background: var(--bg-base);
        color: var(--text-primary);
        padding: 24px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 14px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .status {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .controls {
        display: flex;
        gap: 8px;
      }
      button {
        font-family: var(--body-font);
        font-size: 0.82rem;
        padding: 6px 12px;
        border-radius: var(--radius);
        border: 1px solid var(--border-subtle);
        background: var(--bg-surface);
        color: var(--text-primary);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .empty {
        color: var(--text-muted);
        text-align: center;
        padding: 80px 0;
        font-size: 1.05rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .tile {
        background: var(--card-bg);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius);
        padding: 12px 14px;
      }
      .tile .k {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
      }
      .tile .v {
        font-size: 1.35rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        margin-top: 2px;
      }
      pre {
        background: var(--card-bg);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius);
        padding: 12px;
        font-size: 0.72rem;
        overflow: auto;
        max-height: 320px;
        color: var(--text-muted);
      }
      .flag {
        color: var(--error);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>QKD Analytics</h1>
      <div class="controls" hidden id="controls">
        <button id="eve" title="Toggle the eavesdropper demo (initiator only)">Eavesdropper</button>
        <button id="rotate" title="Rotate the media key immediately">Force rotate</button>
        <button id="reset" title="End and restart the session">Reset session</button>
      </div>
      <div class="status" id="status">Waiting for a call…</div>
    </header>

    <div class="empty" id="empty">
      No live call. Open a call in the main window — this screen fills in automatically once a
      session starts.
    </div>

    <div hidden id="live">
      <div class="grid" id="tiles"></div>
      <pre id="raw"></pre>
    </div>

    <script type="module">
      // Minimal PR-A analytics view: subscribe to the same-origin telemetry bus,
      // render a few real readouts + the raw snapshot (proves the pipe), and post
      // demo commands back. The full panelled dashboard lands in a later PR.
      import { TELEMETRY_CHANNEL } from './static/js/analytics/telemetry.js';

      // Match the call app's stored theme so both windows agree.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('qvc-theme') || 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }

      const bus = new BroadcastChannel(TELEMETRY_CHANNEL);
      const $ = (id) => document.getElementById(id);
      const send = (cmd) => bus.postMessage({ type: 'command', cmd });
      $('eve').addEventListener('click', () => send('toggle-eve'));
      $('rotate').addEventListener('click', () => send('force-rotate'));
      $('reset').addEventListener('click', () => send('reset'));

      const fmt = (v, unit = '') => (v === null || v === undefined ? '—' : `${v}${unit}`);
      const pct = (v) => (typeof v === 'number' ? (v * 100).toFixed(1) + '%' : '—');

      function render(s) {
        const live = !!s.inCall;
        $('empty').hidden = live || s.summary;
        $('live').hidden = !live && !s.summary;
        $('controls').hidden = !live;
        $('eve').disabled = !s.isInitiator;

        const modeLabel = s.mode === 'optical' ? 'OPTICAL' : s.mode ? 'SIMULATED' : '—';
        const mmss =
          `${String(Math.floor((s.elapsed || 0) / 60)).padStart(2, '0')}:` +
          `${String((s.elapsed || 0) % 60).padStart(2, '0')}`;
        const eve = s.eavesdropping || s.peerEavesdropping;
        $('status').innerHTML = s.summary
          ? `Call ended · ${s.keysMinted} keys · ${s.rotations} rotations`
          : `${modeLabel} · ${mmss} · cipher: ${fmt(s.cipherState)}` +
            (eve ? ` · <span class="flag">eavesdropper active</span>` : '');

        const tiles = [
          ['QBER', pct(s.qber)],
          ['Keys minted', fmt(s.keysMinted)],
          ['Rotations', fmt(s.rotations)],
          ['Pool', fmt(s.poolDepth)],
          ['Key index', s.keyIndex === null ? '—' : `#${s.keyIndex}`],
          ['Bandwidth', s.quality ? fmt(s.quality.bandwidthKbps, ' kbps') : '—'],
          ['RTT', s.quality ? fmt(s.quality.rttMs, ' ms') : '—'],
          [
            'Crypto enc/dec',
            s.crypto
              ? `${Math.round(s.crypto.encryptLatencyUs || 0)}/${Math.round(s.crypto.decryptLatencyUs || 0)} µs`
              : '—',
          ],
        ];
        $('tiles').innerHTML = tiles
          .map(
            ([k, v]) =>
              `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`,
          )
          .join('');
        $('raw').textContent = JSON.stringify(s, null, 2);
      }

      bus.onmessage = (e) => {
        const msg = e.data;
        if (msg && msg.type === 'telemetry') render(msg);
      };
    </script>
  </body>
</html>
